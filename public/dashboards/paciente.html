<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroSync - Minha Rotina</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/paciente.css">
</head>
<body>

  <header class="navbar">
        <div class="brand">
            <i class="fa-solid fa-brain logo-icon"></i>
            <span>Neurosync</span>
            <span class="role-badge">Painel Paciente</span>
        </div>
        <div class="nav-user">
            <span class="user-greeting" id="user-name">
                <i class="fa-regular fa-circle-user"></i> Olá
            </span>
            <button id="btn-logout" type="button" class="btn-sair">Sair</button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <div class="main-container">
        <div class="header-title">
            <h1>Minha Rotina</h1>
            <p>Hoje, Segunda-feira</p>
        </div>

        <div class="tasks-list" id="tasks-container">
            <!-- As tarefas serão renderizadas via JS -->
        </div>
    </div>

    <!-- Modal Tô Travado (Passo a Passo) -->
    <div class="modal-overlay" id="modal-travado">
        <div class="modal-card">
            <button class="modal-close" onclick="fecharModal()">&times;</button>
            <div class="modal-header">
                <h2>Vamos devagar</h2>
                <p id="modal-task-name">Nome da Tarefa</p>
            </div>

            <div class="progress-bar-container">
                <div class="progress-info">
                    <span id="progress-step-text">Passo 1 de 3</span>
                    <span id="progress-percent-text">33%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <img id="modal-step-img" src="" alt="Imagem do passo" class="step-image">

            <div class="step-heading" id="modal-step-title">Título do Passo</div>

            <ul class="steps-list" id="modal-steps-list">
                <!-- Passos renderizados dinamicamente -->
            </ul>

            <button class="btn-modal-next" onclick="avancarPasso()">
                Próximo passo ➔
            </button>
        </div>
    </div>

    <!-- Botão SOS e Notificação Toast -->
    <div class="sos-toast" id="sos-toast">
        SOS enviado! Seu cuidador foi notificado.
    </div>
    <button class="sos-btn" onclick="dispararSOS()">SOS!</button>

    <script>
        // Dados das Tarefas (incluindo as duas novas tarefas do vídeo)
        const tarefas = [
            {
                id: 1,
                titulo: "Escovar os dentes",
                imagem: "https://images.unsplash.com/photo-1559599101-f09722fb4948?auto=format&fit=crop&w=300&q=80",
                concluida: true,
                passos: []
            },
            {
                id: 2,
                titulo: "Tomar café da manhã",
                imagem: "https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&w=300&q=80",
                concluida: false,
                passos: [
                    { texto: "Sentar à mesa", img: "https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&w=600&q=80" },
                    { texto: "Comer devagar", img: "https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=600&q=80" },
                    { texto: "Beber água ou leite", img: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=600&q=80" }
                ]
            },
            {
                id: 3,
                titulo: "Tomar banho",
                imagem: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=300&q=80",
                concluida: false,
                passos: [
                    { texto: "Entrar no box e ligar o chuveiro", img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=600&q=80" },
                    { texto: "Passar sabonete no corpo", img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=600&q=80" },
                    { texto: "Se enxugar com a toalha", img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=600&q=80" }
                ]
            },
            {
                id: 4,
                titulo: "Se vestir",
                imagem: "https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?auto=format&fit=crop&w=300&q=80",
                concluida: false,
                passos: [
                    { texto: "Escolher roupa do dia", img: "https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?auto=format&fit=crop&w=600&q=80" },
                    { texto: "Vestir roupa de baixo", img: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=600&q=80" },
                    { texto: "Vestir camisa e calça", img: "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=600&q=80" }
                ]
            },
            {
                id: 5,
                titulo: "Pegar a mochila",
                imagem: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=300&q=80",
                concluida: false,
                passos: [
                    { texto: "Verificar os pertences", img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80" },
                    { texto: "Fechar o zíper", img: "https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=600&q=80" },
                    { texto: "Colocar as alças nas costas", img: "https://images.unsplash.com/photo-1509762774605-f07235a08f1f?auto=format&fit=crop&w=600&q=80" }
                ]
            }
        ];

        let tarefaAtiva = null;
        let passoAtualIndex = 0;

        // Renderizar lista de tarefas na tela
        function renderizarTarefas() {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';

            tarefas.forEach(tarefa => {
                const card = document.createElement('div');
                card.className = 'task-card';

                const htmlAcoes = tarefa.concluida ? `
                    <button class="btn-marcar feito">✓ Feito</button>
                ` : `
                    <button class="btn-marcar" onclick="marcarFeito(${tarefa.id})">✓ Marcar</button>
                    <button class="btn-to-travado" onclick="abrirToTravado(${tarefa.id})">Tô Travado</button>
                `;

                card.innerHTML = `
                    <img src="${tarefa.imagem}" alt="${tarefa.titulo}" class="task-img">
                    <div class="task-content">
                        <div class="task-title">${tarefa.titulo}</div>
                        <div class="task-actions">${htmlAcoes}</div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function marcarFeito(id) {
            const t = tarefas.find(item => item.id === id);
            if (t) {
                t.concluida = true;
                renderizarTarefas();
            }
        }

        // Modal Tô Travado
        function abrirToTravado(id) {
            tarefaAtiva = tarefas.find(item => item.id === id);
            if (!tarefaAtiva || !tarefaAtiva.passos.length) return;

            passoAtualIndex = 0;
            document.getElementById('modal-task-name').innerText = tarefaAtiva.titulo;
            document.getElementById('modal-travado').style.display = 'flex';
            atualizarModalPasso();
        }

        function fecharModal() {
            document.getElementById('modal-travado').style.display = 'none';
        }

        function atualizarModalPasso() {
            const total = tarefaAtiva.passos.length;
            const passo = tarefaAtiva.passos[passoAtualIndex];
            const porcentagem = Math.round(((passoAtualIndex + 1) / total) * 100);

            document.getElementById('progress-step-text').innerText = `Passo ${passoAtualIndex + 1} de ${total}`;
            document.getElementById('progress-percent-text').innerText = `${porcentagem}%`;
            document.getElementById('progress-fill').style.width = `${porcentagem}%`;

            document.getElementById('modal-step-img').src = passo.img;
            document.getElementById('modal-step-title').innerText = passo.texto;

            const listaUl = document.getElementById('modal-steps-list');
            listaUl.innerHTML = '';

            tarefaAtiva.passos.forEach((p, idx) => {
                const li = document.createElement('li');
                let statusClass = '';
                let iconContent = idx + 1;

                if (idx < passoAtualIndex) {
                    statusClass = 'completed';
                    iconContent = '✓';
                } else if (idx === passoAtualIndex) {
                    statusClass = 'active';
                }

                li.className = `step-item ${statusClass}`;
                li.innerHTML = `
                    <span class="step-number">${iconContent}</span>
                    <span>${p.texto}</span>
                `;
                listaUl.appendChild(li);
            });
        }

        function avancarPasso() {
            if (passoAtualIndex < tarefaAtiva.passos.length - 1) {
                passoAtualIndex++;
                atualizarModalPasso();
            } else {
                fecharModal();
                marcarFeito(tarefaAtiva.id);
            }
        }

        // Notificação do SOS
        function dispararSOS() {
            const toast = document.getElementById('sos-toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // Inicialização
        renderizarTarefas();
    </script>
</body>
</html>
