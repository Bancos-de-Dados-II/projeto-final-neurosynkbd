<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroSync - Paciente</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <header class="navbar">
        <div class="brand">
            <i class="fa-solid fa-brain logo-icon"></i>
            <span>NeuroSync</span>
            <span class="role-badge">Paciente</span>
        </div>
        <div class="nav-user">
            <span class="user-greeting" id="user-name">
                <i class="fa-regular fa-circle-user"></i> Olá
            </span>
            <button id="btn-logout" class="btn-sair">Sair</button>
        </div>
    </header>

    <main class="dashboard-container">

        <!-- Card do Cuidador -->
        <div class="table-card" style="margin-bottom: 20px;">
            <div class="table-header">
                <h4><i class="fa-solid fa-user-nurse"></i> Meu Cuidador</h4>
            </div>
            <div style="padding: 16px 24px;" id="info-cuidador">
                <p style="color: var(--text-secondary);">Carregando informações...</p>
            </div>
        </div>

        <!-- Minha Rotina -->
        <div class="table-card">
            <div class="table-header">
                <h4><i class="fa-solid fa-list-check"></i> Minha Rotina</h4>
            </div>
            <div style="padding: 16px 24px;" id="tasks-container">
                <p style="color: var(--text-secondary); text-align: center;">Carregando tarefas...</p>
            </div>
        </div>

        <!-- Botão SOS -->
        <button id="btn-sos" class="btn-primary btn-danger" style="position: fixed; bottom: 30px; right: 30px; padding: 16px 24px; font-size: 18px; border-radius: 50px; box-shadow: var(--shadow-lg); z-index: 50;">
            <i class="fa-solid fa-triangle-exclamation"></i> SOS
        </button>

        <div id="sos-toast" style="display: none; position: fixed; bottom: 100px; right: 30px; background: var(--danger); color: white; padding: 12px 20px; border-radius: 8px; box-shadow: var(--shadow-lg); z-index: 60;">
            🚨 SOS enviado! Cuidador notificado.
        </div>

    </main>

    <script src="../js/paciente.js"></script>
</body>
</html>
