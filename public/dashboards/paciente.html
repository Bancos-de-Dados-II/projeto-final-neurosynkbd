
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroSync - Minha Rotina</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/paciente.css">
</head>
<body>

  <header class="navbar">
        <div class="brand">
            <i class="fa-solid fa-brain logo-icon"></i>
            <span>Neurosync</span>
            <span class="role-badge">Painel Paciente</span>
        </div>
        <div class="nav-user">
            <span class="user-greeting" id="user-name">
                <i class="fa-regular fa-circle-user"></i> Olá
            </span>
            <button id="btn-logout" type="button" class="btn-sair">Sair</button>
        </div>
    </header>

    <div class="card" style="margin-bottom: 20px;">
    <h3 style="color: var(--primary-dark); font-size: 1.1rem; margin-bottom: 10px;">
        <i class="fa-solid fa-user-nurse"></i> Meu Cuidador Responsável
    </h3>
    <div id="info-cuidador">
        <p style="color: var(--text-sub);">Carregando informações do cuidador do banco de dados...</p>
    </div>
</div>
    <!-- Conteúdo Principal -->
    <div class="main-container">
        <div class="header-title">
            <h1>Minha Rotina</h1>
            <p>Hoje, Segunda-feira</p>
        </div>

        <div class="tasks-list" id="tasks-container">
            <!-- As tarefas serão renderizadas via JS -->
        </div>
    </div>

    <!-- Modal Tô Travado (Passo a Passo) -->
    <div class="modal-overlay" id="modal-travado">
        <div class="modal-card">
            <button class="modal-close" onclick="fecharModal()">&times;</button>
            <div class="modal-header">
                <h2>Vamos devagar</h2>
                <p id="modal-task-name">Nome da Tarefa</p>
            </div>

            <div class="progress-bar-container">
                <div class="progress-info">
                    <span id="progress-step-text">Passo 1 de 3</span>
                    <span id="progress-percent-text">33%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <img id="modal-step-img" src="" alt="Imagem do passo" class="step-image">

            <div class="step-heading" id="modal-step-title">Título do Passo</div>

            <ul class="steps-list" id="modal-steps-list">
                <!-- Passos renderizados dinamicamente -->
            </ul>

            <button class="btn-modal-next" onclick="avancarPasso()">
                Próximo passo ➔
            </button>
        </div>
    </div>
    <div class="sos-toast" id="sos-toast">
        SOS enviado! Seu cuidador foi notificado.
    </div>
    <button class="sos-btn" onclick="dispararSOS()">SOS!</button>

    <script>
    const btnLogout = document.getElementById('btn-logout');
    if (btnLogout) {
        btnLogout.addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '../index.html';
        });
    }
    async function carregarRotinasDoBanco() {
        // Recupera o ID do paciente logado
        const pacienteId = localStorage.getItem('usuarioId') || localStorage.getItem('paciente_id');
        const container = document.getElementById('tasks-container');

        if (!pacienteId) {
            console.warn('⚠️ ID do paciente não encontrado no localStorage.');
            if (container) {
                container.innerHTML = '<p style="text-align:center; color:#64748b;">Nenhum paciente identificado. Faça login novamente.</p>';
            }
            return;
        }

        try {
            const response = await fetch(`/api/pacientes/${pacienteId}/rotinas`);

            if (response.ok) {
                const tarefas = await response.json();
                console.log('✅ Rotinas do banco de dados:', tarefas);
                renderizarRotinasReais(tarefas);
            } else {
                console.error('Erro na resposta da API de rotinas:', response.status);
            }
        } catch (error) {
            console.error("❌ Erro ao carregar rotinas do banco:", error);
        }
    }

    function renderizarRotinasReais(tarefas) {
        const container = document.getElementById('tasks-container');
        if (!container) return;

        container.innerHTML = '';

        if (!tarefas || tarefas.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">Nenhuma tarefa cadastrada para você ainda.</p>';
            return;
        }

        tarefas.forEach(tarefa => {
            const card = document.createElement('div');
            card.className = 'task-card';
            const titulo = tarefa.tituloTarefa || tarefa.descriçaoTarefa || 'Tarefa sem título';
            const imagem = tarefa.imagem_Url || '../img/default-task.jpg';

            card.innerHTML = `
                <img src="${imagem}" alt="${titulo}" class="task-img" style="max-height: 200px; object-fit: cover; border-radius: 8px;">
                <div class="task-content" style="padding: 10px 0;">
                    <div class="task-title" style="font-weight: bold; font-size: 1.2rem; margin-bottom: 10px;">${titulo}</div>
                    <div class="task-actions" style="display: flex; gap: 10px;">
                        <button class="btn-marcar" onclick="marcarFeito(this)" style="padding: 8px 16px; cursor: pointer;">✓ Concluir</button>
                        <button class="btn-to-travado" onclick="abrirToTravado('${titulo}')" style="padding: 8px 16px; cursor: pointer;">Tô Travado</button>
                    </div>
                </div>
            `;

            container.appendChild(card);
        });
    }

    function marcarFeito(btn) {
        btn.innerText = '✓ Concluído!';
        btn.style.backgroundColor = '#16a34a';
        btn.style.color = '#ffffff';
        btn.disabled = true;
    }

    function abrirToTravado(titulo) {
        document.getElementById('modal-task-name').innerText = titulo;
        document.getElementById('modal-travado').style.display = 'flex';
    }

    function fecharModal() {
        document.getElementById('modal-travado').style.display = 'none';
    }

    function dispararSOS() {
        const toast = document.getElementById('sos-toast');
        if (toast) {
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    }
    document.addEventListener('DOMContentLoaded', carregarRotinasDoBanco);
</script>
</body>
</html>
